services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dah_db}
      POSTGRES_USER: ${DB_USER:-dah}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dah_password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dah} -d ${DB_NAME:-dah_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ENV: prod
      DB_HOST: db
      # Pas de reverse proxy TLS devant ce stack local : on désactive la
      # redirection HTTPS forcée et les cookies "Secure only" de prod.py,
      # sinon rien n'est accessible en http://localhost.
      SECURE_SSL_REDIRECT: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_files_prod:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  media_files_prod:
