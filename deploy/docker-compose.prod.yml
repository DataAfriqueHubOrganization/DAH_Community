# Production sur un serveur (Contabo) — voir deploy/DEPLOY.md.
#   cd deploy && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Un seul domaine : nginx sert le site (Next.js) et l'API (Django) derrière HTTPS,
# ainsi que les fichiers envoyés (volumes persistants).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port publié : la base n'est joignable que depuis le backend.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENV: prod
      DB_HOST: db
      DB_PORT: "5432"
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private_media
      PRIVATE_MEDIA_ACCEL_REDIRECT: /protected/
      CLIENT_IP_HEADER: HTTP_X_REAL_IP
    volumes:
      - media:/app/media
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - media:/srv/media:ro
      - private_media:/srv/private_media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  # Renouvelle les certificats HTTPS (Let's Encrypt) deux fois par jour.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  media:
  private_media:
  certbot_conf:
  certbot_www:
